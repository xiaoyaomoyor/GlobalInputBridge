name: Build Plugin

# 用 GitHub 托管的 Windows Runner 上预装的 Unreal Engine 编译插件。
# 注意：优先使用 UE_5.7（本插件的开发/测试版本）；若镜像暂未提供 5.7，
# 回退到镜像上最新的 UE_5.* 并临时改写 uplugin 的 EngineVersion，
# 以便 UAT BuildPlugin 接受构建。若回退版本编译失败，可在下方手动固定版本。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (Win64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Unreal Engine
        id: engine
        shell: powershell
        run: |
          $engines = Get-ChildItem "C:\Program Files\Epic Games\UE_*" -Directory | Sort-Object Name -Descending
          if (-not $engines) {
            Write-Error "Runner 镜像上没有找到任何 Unreal Engine 安装（C:\Program Files\Epic Games\UE_*）。"
            exit 1
          }
          $preferred = $engines | Where-Object { $_.Name -eq 'UE_5.7' } | Select-Object -First 1
          $engine = if ($preferred) { $preferred } else { $engines[0] }
          if ($engine.Name -ne 'UE_5.7') {
            Write-Warning "::warning::未找到 UE_5.7，回退使用 $($engine.Name)（将临时改写 uplugin 的 EngineVersion）。"
          }
          Write-Host "Using engine: $($engine.FullName)"
          "path=$($engine.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$($engine.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Match uplugin EngineVersion (fallback engines only)
        if: steps.engine.outputs.version != 'UE_5.7'
        shell: powershell
        run: |
          $engineVersion = "${{ steps.engine.outputs.version }}" -replace '^UE_', ''
          $uplugin = "GlobalInputBridge.uplugin"
          (Get-Content $uplugin -Raw) -replace '"EngineVersion"\s*:\s*"[^"]*"', "`"EngineVersion`": `"$engineVersion.0`"" | Set-Content $uplugin -NoNewline
          Write-Host "Patched EngineVersion to $engineVersion.0 for this CI build only."

      - name: Build Plugin (RunUAT BuildPlugin)
        shell: cmd
        env:
          UE_PATH: ${{ steps.engine.outputs.path }}
        run: |
          "%UE_PATH%\Engine\Build\BatchFiles\RunUAT.bat" BuildPlugin ^
            -Plugin="%GITHUB_WORKSPACE%\GlobalInputBridge.uplugin" ^
            -Package="%GITHUB_WORKSPACE%\Build\Package" ^
            -TargetPlatforms=Win64 ^
            -Stage

      - name: Upload Build Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: |
            Build/Package/Logs
            *.txt
          if-no-files-found: ignore

      - name: Upload Plugin Package
        uses: actions/upload-artifact@v4
        with:
          name: GlobalInputBridge-package
          path: Build/Package
